name: Python checks

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Make sure the project still works
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the required pieces
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest
